{% extends 'base/base.html' %}

{% block content %}
{% include 'base/navbar.html' %}

<div style="text-align: center;">
<p class="titoli-pagine">Eliminazione</p>
<br>
<form method="POST" action="">  
    {% csrf_token %}
    <p>Sei sicuro di voler eliminare "{{obj}}"?</p>
    <a style="color:white"  href="{{request.META.HTTP_REFERER}}">
        <button class="btn btn-secondary">Annulla</button>
    </a>
    <input  style="margin-left: 1%;" type="submit" value="Elimina" type="button" class="btn btn-danger"/>
</form>
</div>
{% endblock %}
