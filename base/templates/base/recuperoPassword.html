{% extends 'base/base.html' %}

{% block content %}
<style>
  .centrato {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    flex-direction: column;
    margin-top: 10%;
  }

  form {
    width: 100%;
    max-width: 300px;
  }

</style>

<div class="centrato">
  <p class="titoli-pagine">Recupero password account ChatBDT</p>
  <form action="" method="POST">
    {% csrf_token %}
    <label for="email" style="text-align: left;">Email:</label>
    <input type="email" id="email" name="email" />
    <br>
    <br>
    {% if mess %}
    {% if messages %}
      {% for message in messages %}
        <div>{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% endif %}
    <button type="submit" class="btn btn-info" style="margin-top: 5%;">Recupera</button>
    
  </form>
</div>

{% endblock %}
