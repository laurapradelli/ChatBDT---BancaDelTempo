{% extends 'base/base.html' %}

{% block content %}
{% load static %}
<style>
  .centrato {
    display: flex;
    justify-content: center;

  }

  .password-container {
    position: relative;
    width: fit-content;
  }

  .toggle-password {
    margin-left: 87%;
    transform: translateY(-125%);
    cursor: pointer;
    display: flex;
    align-items: center;
  }

  .toggle-password img {
    width: 20px;
    height: 20px;
  }
</style>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Reddit+Sans:ital,wght@0,200..900;1,200..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
</head>
<h3 class="login">Entra in ChatBDT!</h3>
<br />
<br />

<div class="centrato">
  <form class="" method="POST" action="">
    {% csrf_token %}
    <div class="form__group form__group">
      <label for="room_name">Email</label>
      <br />
      <input id="email" name="email" type="text" placeholder="nome@mail.com" />
      <br />
      <br />
    </div>
    <div class="password-container">
      <label for="password">Password</label>
      <br>
      <input type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" >
      <img class="toggle-password" onclick="togglePassword()" id="toggle-password-icon" src="{% static 'images/closed_eye.svg' %}" alt="Toggle Password Visibility" height="20px" width="20px">
    </div>
    
    <a href="{% url 'recupera_password' %}">
      <p>Recupera password</p>
    </a>
    
    <div style="text-align: center;">
      <button type="submit" type="button" class="btn btn-warning">Login</button>
    </div>
    
  </form>
  <br>
  
</div>
<div style="display:flex; justify-content: center; text-align: center;">
  <br><br>
  {% if mess %}
  {% if messages %}
  {% for message in messages %}
  {{message}}
  <br>
  {% endfor %}
  {% endif %}
  {% endif %}
</div>


<script>
  function togglePassword() {
    var passwordField = document.getElementById('password');
    var passwordFieldType = passwordField.getAttribute('type');
    var toggleIcon = document.getElementById('toggle-password-icon');

    if (passwordFieldType === 'password') {
      passwordField.setAttribute('type', 'text');
      toggleIcon.setAttribute('src', '{% static "images/open_eye.svg" %}');
    } else {
      passwordField.setAttribute('type', 'password');
      toggleIcon.setAttribute('src', '{% static "images/closed_eye.svg" %}');
    }
  }
</script>

{% endblock %}
