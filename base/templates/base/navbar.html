<style>
  .container-fluid {
    display: flex;
    align-items: center;
    flex-wrap: wrap
  }

  .azioni {
    text-align: right;
  }

  .home-container {
    display: grid;
    grid-template-columns: 1fr 3fr;
    font-family: poppins
  }

  .btn {
    margin-top: 3px;
    margin-bottom: 3px;
  }

  .col {
    margin: 3%;
  }

  .navbar {
    font-family: poppins;
  }

  .navbar-brand {
    display: flex;
    align-items: center;
    white-space: normal;
  }

  @media only screen and (max-width: 600px) {
    .navbar-brand {
      font-size: 20px;
      /* Riduci la dimensione del testo del brand */
    }

    .azioni {
      text-align: center;
      /* Centra gli elementi nella parte destra */
    }

    .btn {
      margin: 5px;
      /* Aumenta il margine dei pulsanti */
    }
  }
</style>
{% load static %}

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Reddit+Sans:ital,wght@0,200..900;1,200..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">
</head>

<nav class="navbar bg-body-tertiary">
  <div class="container-fluid d-flex align-items-center">
    <a class="navbar-brand" href="{% url 'profilo' user.id %}" style="color:black; font-size:25px;font-weight: 600;">
      <img src="{{bdt.logo_bdt.url}}" alt="Logo" width="75" height="85" class="d-inline-block align-text-center" style="margin-right: 15px;">
      Banca del Tempo {{bdt.nome_bdt}}
    </a>

    <div class="azioni">
      {% if request.user.is_authenticated %}
      <a href="{% url 'change_password' %}"><button type="button" class="btn btn-info"
          style="margin-right: 10px;">Cambia password</button></a>
      <a href="{% url 'logout' %}"><button type="button" class="btn btn-info"
          style="margin-right: 10px;">Logout</button></a>
      {% if request.user.tesoriere %}
      <a href="{% url 'tes_profilo_socio' request.user.id %}"><img src="{% static 'images/avatar_cerchio.webp' %}"
          alt="User" width="50" height="50"></a>
      {% else %}
      <a href="{% url 'profilo' request.user.id %}"><img src="{% static 'images/avatar_cerchio.webp' %}" alt="User"
          width="50" height="50"></a>
      {% endif %}

      {% endif %}
    </div>
  </div>
</nav>
